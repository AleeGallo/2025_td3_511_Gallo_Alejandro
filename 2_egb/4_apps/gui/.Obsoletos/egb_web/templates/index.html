<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EGB Control Interface</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Control de Parámetros EGB</h1>
    
    <div class="params-section">
        <h2>Parámetros</h2>
        {% for param in ['KP', 'KI', 'KD', 'R', 'T', 'SP'] %}
        <div class="param">
            <label for="{{ param }}">{{ param }}:</label>
            <input type="number" id="{{ param }}" step="0.01">
            <button onclick="setParam('{{ param }}')">Set</button>
            <button onclick="getParam('{{ param }}')">Get</button>
        </div>
        {% endfor %}
    </div>
    
    <div class="chart-section">
        <h2>Gráfico de Corriente en Tiempo Real</h2>
        <canvas id="currentChart"></canvas>
    </div>
    
    <div class="terminal-section">
        <h2>Mini Terminal</h2>
        <textarea id="terminal" readonly></textarea>
        <button onclick="clearTerminal()">Limpiar</button>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
